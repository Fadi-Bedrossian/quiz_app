apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-api
spec:
  replicas: {{ .Values.replicaCount.api }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: quiz-api }
  template:
    metadata:
      labels:
        app: quiz-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: quiz-api
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          envFrom:
            - configMapRef:
                name: quiz-api-config
          volumeMounts:
            - { name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }
          readinessProbe: { httpGet: { path: /api/healthz, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/healthz, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 20 }
          startupProbe: { httpGet: { path: /api/healthz, port: 8000 }, failureThreshold: 30, periodSeconds: 5 }
          resources: {{- toYaml .Values.resources.api | nindent 12 }}
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: quiz-api-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-api
spec:
  selector: { app: quiz-api }
  ports: [{ port: 8000, targetPort: 8000 }]
