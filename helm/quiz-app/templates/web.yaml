apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-web
spec:
  replicas: {{ .Values.replicaCount.web }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: quiz-web }
  template:
    metadata:
      labels: { app: quiz-web }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 20 }
          startupProbe: { httpGet: { path: /healthz, port: 8080 }, failureThreshold: 20, periodSeconds: 3 }
          resources: {{- toYaml .Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-web
spec:
  type: ClusterIP
  selector: { app: quiz-web }
  ports: [{ port: 80, targetPort: 8080 }]
