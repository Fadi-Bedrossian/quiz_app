name: Application
on:
  pull_request:
    paths: ['app/**', 'helm/**', 'scripts/aks-command.sh', '.github/workflows/app.yml']
  push:
    branches: [develop, main]
    paths: ['app/**', 'helm/**', 'scripts/aks-command.sh', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/repo-check.py
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -e './app/api[dev]'
      - run: ruff check app/api
      - run: pytest app/api
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
        working-directory: app/web
      - run: npm run lint && npm run test && npm run build
        working-directory: app/web
      - uses: azure/setup-helm@v4
      - run: helm lint helm/quiz-app
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: '.', severity: 'HIGH,CRITICAL', exit-code: '1' }

  deploy:
    # Keep production disabled until prod infrastructure is provisioned.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    concurrency:
      group: app-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Build and push images
        env: { TAG: '${{ github.sha }}' }
        shell: bash
        run: |
          docker build -t "${{ vars.ACR_NAME }}.azurecr.io/quiz-api:$TAG" app/api
          docker build \
            --build-arg VITE_ENTRA_TENANT_ID="${{ vars.AZURE_TENANT_ID }}" \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg VITE_ENTRA_AUDIENCE="${{ vars.ENTRA_AUDIENCE }}" \
            -t "${{ vars.ACR_NAME }}.azurecr.io/quiz-web:$TAG" app/web
          docker push "${{ vars.ACR_NAME }}.azurecr.io/quiz-api:$TAG"
          docker push "${{ vars.ACR_NAME }}.azurecr.io/quiz-web:$TAG"
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.ACR_NAME }}.azurecr.io/quiz-api:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.ACR_NAME }}.azurecr.io/quiz-web:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Deploy Helm release through AKS command invoke
        shell: bash
        run: |
          ENV=${{ steps.env.outputs.name }}
          PUBLIC_HOSTNAME="${{ vars.PUBLIC_URL }}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME#http://}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME#https://}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME%%/*}"

          cd helm/quiz-app

          cat > deploy.sh <<'EOF'
          set -euo pipefail

          RELEASE="quiz-$ENV"
          NAMESPACE="quiz-$ENV"
          TRAEFIK_RELEASE="traefik-$ENV"
          TRAEFIK_NAMESPACE="traefik-$ENV"
          TRAEFIK_CLASS="traefik-$ENV"

          : "${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required}"
          : "${PUBLIC_IP_NAME:?PUBLIC_IP_NAME is required}"
          : "${AZURE_RESOURCE_GROUP:?AZURE_RESOURCE_GROUP is required}"

          # cert-manager is shared by dev/prod and installed once per cluster.
          CM_STATUS="$(helm status cert-manager -n cert-manager -o json 2>/dev/null | jq -r '.info.status // empty' || true)"
          if [ "$CM_STATUS" != "deployed" ]; then
            helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
              --version v1.21.2 \
              -n cert-manager --create-namespace \
              --set crds.enabled=true \
              --wait --timeout 3m
          fi

          kubectl wait -n cert-manager --for=condition=Available deployment/cert-manager --timeout=90s
          kubectl wait -n cert-manager --for=condition=Available deployment/cert-manager-webhook --timeout=90s

          # A previously interrupted Helm operation can leave the newest
          # release secret in pending-install/pending-upgrade/pending-rollback.
          PENDING_SECRET="$(kubectl get secrets -n "$NAMESPACE" \
            -l "owner=helm,name=$RELEASE" \
            --sort-by=.metadata.labels.version \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.status}{"\\n"}{end}' 2>/dev/null \
            | awk '$2 ~ /^pending-/ {name=$1} END {print name}')"

          if [ -n "$PENDING_SECRET" ]; then
            echo "Removing stale Helm pending revision: $PENDING_SECRET"
            kubectl delete secret "$PENDING_SECRET" -n "$NAMESPACE"
          fi

          # First move quiz-web from LoadBalancer to ClusterIP. This releases
          # the existing static Azure Public IP so Traefik can own it.
          helm upgrade --install "$RELEASE" . -n "$NAMESPACE" --create-namespace -f "values-$ENV.yaml" \
            --set image.api.repository="${{ vars.ACR_NAME }}.azurecr.io/quiz-api" \
            --set image.web.repository="${{ vars.ACR_NAME }}.azurecr.io/quiz-web" \
            --set image.api.tag="${{ github.sha }}" --set image.web.tag="${{ github.sha }}" \
            --set ingress.enabled=true \
            --set ingress.host="$PUBLIC_HOSTNAME" \
            --set ingress.className="$TRAEFIK_CLASS" \
            --set workloadIdentityClientId="${{ vars.WORKLOAD_IDENTITY_CLIENT_ID }}" --set tenantId="${{ vars.AZURE_TENANT_ID }}" --set keyVaultName="${{ vars.KEY_VAULT_NAME }}" \
            --set postgres.host="${{ vars.POSTGRES_HOST }}" --set postgres.database="${{ vars.POSTGRES_DATABASE }}" --set postgres.user="${{ vars.POSTGRES_ADMIN_USER }}" \
            --set entra.tenantId="${{ vars.AZURE_TENANT_ID }}" \
            --set entra.audience="${{ vars.ENTRA_AUDIENCE }}" \
            --set entra.adminGroupId="${{ vars.ADMIN_GROUP_ID }}" \
            --atomic --cleanup-on-fail --timeout 3m

          cat >/tmp/traefik-values.yaml <<VALUES
          ingressClass:
            enabled: true
            isDefaultClass: false
            name: "$TRAEFIK_CLASS"
          providers:
            kubernetesIngress:
              enabled: true
              ingressClass: "$TRAEFIK_CLASS"
              namespaces:
                - "$NAMESPACE"
          service:
            annotations:
              service.beta.kubernetes.io/azure-pip-name: "$PUBLIC_IP_NAME"
              service.beta.kubernetes.io/azure-load-balancer-resource-group: "$AZURE_RESOURCE_GROUP"
          VALUES

          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo update traefik

          helm upgrade --install "$TRAEFIK_RELEASE" traefik/traefik \
            --version 41.6.0 \
            -n "$TRAEFIK_NAMESPACE" --create-namespace \
            -f /tmp/traefik-values.yaml \
            --wait --timeout 3m

          # cert-manager uses HTTP-01 through this environment's Traefik class.
          kubectl wait -n "$NAMESPACE" --for=condition=Ready certificate/quiz-web-tls --timeout=180s

          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get service -n "$NAMESPACE"
          kubectl get ingress -n "$NAMESPACE"
          kubectl get certificate -n "$NAMESPACE"
          kubectl get service -n "$TRAEFIK_NAMESPACE"
          EOF

          bash ../../scripts/aks-command.sh \
            "${{ vars.AZURE_RESOURCE_GROUP }}" \
            "${{ vars.AKS_NAME }}" \
            "ENV=$ENV PUBLIC_HOSTNAME=$PUBLIC_HOSTNAME PUBLIC_IP_NAME=${{ vars.PUBLIC_IP_NAME }} AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }} bash deploy.sh" \
            "."

      - name: Smoke test API over HTTPS
        shell: bash
        run: |
          PUBLIC_HOSTNAME="${{ vars.PUBLIC_URL }}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME#http://}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME#https://}"
          PUBLIC_HOSTNAME="${PUBLIC_HOSTNAME%%/*}"

          curl --fail --show-error --retry 18 --retry-delay 10 --retry-all-errors \
            "https://$PUBLIC_HOSTNAME/api/healthz"

      - name: Collect AKS diagnostics
        if: failure()
        shell: bash
        run: |
          ENV=${{ steps.env.outputs.name }}

          DIAG_COMMAND="kubectl get pods -n quiz-$ENV -o wide; echo '--- services ---'; kubectl get svc -n quiz-$ENV; echo '--- ingress ---'; kubectl get ingress -n quiz-$ENV -o wide; kubectl describe ingress/quiz-web -n quiz-$ENV || true; echo '--- certificate ---'; kubectl get issuer,certificate,order,challenge -n quiz-$ENV || true; kubectl describe certificate/quiz-web-tls -n quiz-$ENV || true; kubectl describe issuer/letsencrypt -n quiz-$ENV || true; echo '--- traefik ---'; kubectl get pods,svc -n traefik-$ENV -o wide || true; kubectl describe svc/traefik-$ENV -n traefik-$ENV || true; echo '--- api deployment ---'; kubectl describe deployment/quiz-api -n quiz-$ENV; echo '--- api pods ---'; kubectl describe pods -n quiz-$ENV -l app=quiz-api; echo '--- api logs ---'; kubectl logs deployment/quiz-api -n quiz-$ENV --tail=120 --all-containers=true || true; echo '--- postgres describe ---'; kubectl describe statefulset/quiz-postgres -n quiz-$ENV; echo '--- postgres logs ---'; kubectl logs statefulset/quiz-postgres -n quiz-$ENV --tail=120 --all-containers=true || true"

          bash scripts/aks-command.sh \
            "${{ vars.AZURE_RESOURCE_GROUP }}" \
            "${{ vars.AKS_NAME }}" \
            "$DIAG_COMMAND" || true
