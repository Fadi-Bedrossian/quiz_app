name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/bootstrap-azure.sh'
      - '.github/workflows/infrastructure.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      operation:
        description: Terraform operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      confirm_destroy:
        description: Required only for destroy
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Repository checks
        run: python scripts/repo-check.py

      - name: Terraform format
        run: terraform fmt -recursive -check infra

      - name: Terraform security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'

  pull-request-plan:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Prepare temporary Key Vault firewall access
        shell: bash
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          RUNNER_CIDR="${RUNNER_IP}/32"
          echo "TF_VAR_ci_runner_ip=$RUNNER_CIDR" >> "$GITHUB_ENV"
          echo "CI_RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"

          KV_NAME="$(az keyvault list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'sg-quiz-kv-')].name | [0]" \
            -o tsv)"

          if [ -n "$KV_NAME" ]; then
            az keyvault network-rule add \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$KV_NAME" \
              --ip-address "$RUNNER_CIDR" \
              -o none
          fi


      - name: Plan shared infrastructure
        shell: bash
        run: |
          terraform -chdir=infra/shared init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=shared.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

          terraform -chdir=infra/shared validate

          terraform -chdir=infra/shared plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}"

      - name: Remove temporary Key Vault firewall access
        if: always() && env.CI_RUNNER_CIDR != ''
        shell: bash
        run: |
          KV_NAME="$(az keyvault list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'sg-quiz-kv-')].name | [0]" \
            -o tsv)"

          if [ -n "$KV_NAME" ]; then
            az keyvault network-rule remove \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$KV_NAME" \
              --ip-address "$CI_RUNNER_CIDR" \
              -o none || true
          fi

  terraform:
    if: github.event_name == 'workflow_dispatch'
    needs: quality
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-infrastructure
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Validate destroy confirmation
        if: inputs.operation == 'destroy' && !inputs.confirm_destroy
        run: |
          echo "Destroy requires confirm_destroy=true."
          exit 1

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Prepare temporary Key Vault firewall access
        shell: bash
        run: |
          RUNNER_IP="$(curl -fsS https://api.ipify.org)"
          RUNNER_CIDR="${RUNNER_IP}/32"
          echo "TF_VAR_ci_runner_ip=$RUNNER_CIDR" >> "$GITHUB_ENV"
          echo "CI_RUNNER_CIDR=$RUNNER_CIDR" >> "$GITHUB_ENV"

          KV_NAME="$(az keyvault list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'sg-quiz-kv-')].name | [0]" \
            -o tsv)"

          if [ -n "$KV_NAME" ]; then
            az keyvault network-rule add \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$KV_NAME" \
              --ip-address "$RUNNER_CIDR" \
              -o none
          fi


      - name: Select AKS VM size with available quota
        if: inputs.operation != 'destroy'
        shell: bash
        run: |
          LOCATION="${{ vars.AZURE_LOCATION }}"
          LOCATION="${LOCATION:-northeurope}"
          VM_SIZE="$(bash scripts/select-aks-vm-size.sh "$LOCATION")"
          echo "Selected AKS VM size: $VM_SIZE"
          echo "TF_VAR_node_vm_size=$VM_SIZE" >> "$GITHUB_ENV"

      - name: Initialize shared state
        if: inputs.operation != 'destroy'
        shell: bash
        run: |
          terraform -chdir=infra/shared init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=shared.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

          terraform -chdir=infra/shared validate

      - name: Plan shared infrastructure
        if: inputs.operation == 'plan'
        shell: bash
        run: |
          terraform -chdir=infra/shared plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}"

      - name: Apply shared infrastructure
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir=infra/shared apply -auto-approve -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}"

      - name: Check whether shared state exists
        if: inputs.operation == 'plan'
        id: shared
        shell: bash
        run: |
          if terraform -chdir=infra/shared output -json >/tmp/shared-outputs.json 2>/dev/null && \
             [ "$(jq 'length' /tmp/shared-outputs.json)" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Shared infrastructure has not been applied yet."
            echo "This first plan therefore shows the shared resources only."
            echo "Run Apply for ${{ inputs.environment }} to create shared resources and then ${{ inputs.environment }}."
          fi

      - name: Initialize environment state
        if: inputs.operation == 'apply' || inputs.operation == 'destroy' || (inputs.operation == 'plan' && steps.shared.outputs.ready == 'true')
        shell: bash
        run: |
          terraform -chdir=infra/environments/${{ inputs.environment }} init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=${{ inputs.environment }}.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

          terraform -chdir=infra/environments/${{ inputs.environment }} validate

      - name: Plan environment
        if: inputs.operation == 'plan' && steps.shared.outputs.ready == 'true'
        shell: bash
        run: |
          terraform -chdir=infra/environments/${{ inputs.environment }} plan -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}" \
            -var="tfstate_storage_account=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"

      - name: Apply environment
        if: inputs.operation == 'apply'
        shell: bash
        run: |
          terraform -chdir=infra/environments/${{ inputs.environment }} apply -auto-approve -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}" \
            -var="tfstate_storage_account=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"

      - name: Destroy environment
        if: inputs.operation == 'destroy' && inputs.confirm_destroy
        shell: bash
        run: |
          terraform -chdir=infra/environments/${{ inputs.environment }} destroy -auto-approve -input=false -lock-timeout=5m \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -var="tenant_id=${{ vars.AZURE_TENANT_ID }}" \
            -var="infra_client_id=${{ vars.AZURE_INFRA_CLIENT_ID }}" \
            -var="tfstate_storage_account=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"

      - name: Remove temporary Key Vault firewall access
        if: always() && env.CI_RUNNER_CIDR != ''
        shell: bash
        run: |
          KV_NAME="$(az keyvault list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?starts_with(name, 'sg-quiz-kv-')].name | [0]" \
            -o tsv)"

          if [ -n "$KV_NAME" ]; then
            az keyvault network-rule remove \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$KV_NAME" \
              --ip-address "$CI_RUNNER_CIDR" \
              -o none || true
          fi
