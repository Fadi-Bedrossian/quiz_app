apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quiz-api-dev
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - quiz-dev
  selector:
    matchLabels:
      app: quiz-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: quiz-api-prod
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - quiz-prod
  selector:
    matchLabels:
      app: quiz-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app: loki
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
