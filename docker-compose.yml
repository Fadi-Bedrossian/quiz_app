services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizadmin
      POSTGRES_PASSWORD: quizpassword
      POSTGRES_DB: quiz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizadmin"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./app/api
    environment:
      DB_HOST: postgres
      DB_NAME: quiz
      DB_USER: quizadmin
      DB_PASSWORD: quizpassword
      DB_SSLMODE: disable
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./app/web
    ports: ["8080:8080"]
    depends_on: [api]
